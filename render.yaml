services:
  - type: web
    name: monitor-fiis
    runtime: python
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.headless=true --server.address=0.0.0.0 --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USER
        value: Fabricio
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_PASSWORD_ALT
        sync: false
      - key: STREAMLIT_THEME_BASE
        value: light
      - key: STREAMLIT_THEME_PRIMARY_COLOR
        value: "#009974"
      - key: STREAMLIT_THEME_BACKGROUND_COLOR
        value: "#F5F5F4"
      - key: STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR
        value: "#FFFFFF"
      - key: STREAMLIT_THEME_TEXT_COLOR
        value: "#293038"
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RECOVERY_EMAIL
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
