services:
  - type: web
    name: monitor-fiis
    runtime: python
    plan: free
    region: oregon
    branch: master
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port=$PORT --server.headless=true --server.address=0.0.0.0 --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AUTH_USER
        value: Fabricio
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_PASSWORD_ALT
        sync: false
      - key: STREAMLIT_THEME_BASE
        value: dark
      - key: STREAMLIT_THEME_PRIMARY_COLOR
        value: "#F39200"
      - key: STREAMLIT_THEME_BACKGROUND_COLOR
        value: "#1A1A1A"
      - key: STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR
        value: "#242424"
      - key: STREAMLIT_THEME_TEXT_COLOR
        value: "#F5F5F5"
      - key: SMTP_SERVER
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: RECOVERY_EMAIL
        sync: false
      - key: WHATSAPP_PHONE
        value: "5511973674455"
      - key: WHATSAPP_APIKEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
