name: Relatorio diario WhatsApp

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Rodar vigia e enviar no WhatsApp
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VIGIA_URL: ${{ secrets.VIGIA_URL }}
          TZ: America/Sao_Paulo
        run: |
          if [ -z "$WHATSAPP_APIKEY" ]; then
            echo "::error::Falta o secret WHATSAPP_APIKEY"
            exit 1
          fi
          python vigia.py
