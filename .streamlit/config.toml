[runner]
fastReruns = true

[server]
headless = true
address = "0.0.0.0"
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#F39200"
backgroundColor = "#1A1A1A"
secondaryBackgroundColor = "#242424"
textColor = "#F5F5F5"
linkColor = "#F39200"
borderColor = "#333333"
dataframeBorderColor = "#333333"
dataframeHeaderBackgroundColor = "#111111"
codeBackgroundColor = "#111111"
codeTextColor = "#F39200"
redColor = "#FF5252"
orangeColor = "#F39200"
greenColor = "#00C853"
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap"
headingFont = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 16
headingFontSizes = ["1.75rem", "1.3rem", "1.1rem"]
headingFontWeights = [700, 700, 500]
metricValueFontSize = "1.4rem"
metricValueFontWeight = 700
baseRadius = "0.35rem"
buttonRadius = "0.35rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
    "#F39200",
    "#00C853",
    "#42A5F5",
    "#FF5252",
    "#AB47BC",
    "#26C6DA",
    "#FFCA28",
    "#8D6E63",
]

[theme.sidebar]
backgroundColor = "#111111"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#F5F5F5"
primaryColor = "#F39200"
borderColor = "#2A2A2A"
linkColor = "#F39200"

[theme.dark]
primaryColor = "#F39200"
backgroundColor = "#1A1A1A"
secondaryBackgroundColor = "#242424"
textColor = "#F5F5F5"
linkColor = "#F39200"
borderColor = "#333333"

[theme.dark.sidebar]
backgroundColor = "#111111"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#F5F5F5"
primaryColor = "#F39200"
borderColor = "#2A2A2A"

[theme.light]
primaryColor = "#F39200"
backgroundColor = "#1A1A1A"
secondaryBackgroundColor = "#242424"
textColor = "#F5F5F5"
linkColor = "#F39200"
borderColor = "#333333"

[theme.light.sidebar]
backgroundColor = "#111111"
secondaryBackgroundColor = "#1C1C1C"
textColor = "#F5F5F5"
primaryColor = "#F39200"
borderColor = "#2A2A2A"
