[runner]
fastReruns = true

[server]
headless = true
address = "0.0.0.0"
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#009974"
backgroundColor = "#F5F5F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#293038"
linkColor = "#009974"
borderColor = "#E3E6ED"
dataframeBorderColor = "#E3E6ED"
dataframeHeaderBackgroundColor = "#EDF1F3"
codeBackgroundColor = "#F0F2F4"
codeTextColor = "#009974"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 16
headingFontSizes = ["1.85rem", "1.35rem", "1.15rem"]
headingFontWeights = [700, 650, 600]
metricValueFontSize = "1.45rem"
metricValueFontWeight = 700
baseRadius = "0.5rem"
buttonRadius = "0.45rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = [
    "#009974",
    "#4D81E7",
    "#CF6A17",
    "#10B981",
    "#59886B",
    "#A07D45",
    "#2299DD",
    "#ED1752",
]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F4"
borderColor = "#E3E6ED"
